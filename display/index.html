<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salah Board</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" id="theme-css" href="./themes/classic/theme.css">
<link rel="stylesheet" href="./css/layout.css">
</head>
<body>
  <div id="screen-root" class="screen-root"></div>
  <div id="night-overlay" aria-hidden="true"></div>

  <!-- Click/tap anywhere on the board opens the on-device settings page —
       the same gesture the Android shell uses (touch the screen → settings).
       The board has no other interactive elements, so any click means "settings". -->
  <script>
    // Not when embedded (the admin Advanced tab shows the board in a preview frame).
    if (window.self === window.top) {
      document.addEventListener('click', function () { location.href = '../admin/'; });
    }
  </script>

  <script src="./js/config.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
