name: Emulator smoke test

# Boots a headless Android emulator in CI, installs the debug APK,
# launches the app, and fails loudly with the logcat crash trace if the
# process dies. This exists because the dev machine has no Android SDK —
# runtime crashes are diagnosed from this job's log instead of local adb.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Launch app on emulator and check it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The runner executes each script line as a separate command —
          # anything multi-line lives in smoke.sh.
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: |
            logcat.txt
            screen.png
