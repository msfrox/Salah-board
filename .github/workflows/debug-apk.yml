name: Debug APK (unsigned, for testing)

# Builds an installable-but-unsigned debug APK on every push/PR touching
# the Android shell, plus on-demand. This is the "just let me test it on
# my phone" workflow — no keystore secrets needed (debug builds are
# auto-signed with Android's shared debug key). For a real release build
# use a `v*` tag, which runs .github/workflows/release.yml instead.
#
# Published to a single rolling pre-release tagged `debug-latest` (updated
# in place on every run, not a new release each time) so there's always
# one obvious place to grab the newest build from — the repo's Releases
# page — instead of digging through Actions run artifacts.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/debug-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: salah-board-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to rolling "debug-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug build (latest main)"
          body: |
            Unsigned debug APK, auto-built from `${{ github.sha }}` on every push to `main`.
            Not a real release — sideload for testing only. See android/README.md.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
