name: Android release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        run: echo "${{ secrets.SALAH_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build signed release APK
        env:
          SALAH_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore.jks
          SALAH_KEYSTORE_PASSWORD: ${{ secrets.SALAH_KEYSTORE_PASSWORD }}
          SALAH_KEY_ALIAS: ${{ secrets.SALAH_KEY_ALIAS }}
          SALAH_KEY_PASSWORD: ${{ secrets.SALAH_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app-release.apk.sha256
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
