# ============================================================
# Salah Board — Debian automated-install answer file (preseed).
#
# Answers every Debian installer question so you don't have to:
# hostname, user, timezone, full-disk partitioning, no desktop, GRUB.
# Optionally it also clones this repo and auto-runs the kiosk installer
# on first boot, so the tablet turns itself into a board unattended.
#
# HOW TO USE IT (see deploy/linux/INSTALL-DEBIAN.md for the full walk-through):
#   At the Debian installer's first screen, highlight "Install", press TAB
#   (or ESC → edit the boot line) and append:
#       auto=true priority=critical \
#       preseed/url=https://raw.githubusercontent.com/msfrox/Salah-board/main/deploy/linux/preseed.cfg
#   then Enter. You'll still pick your WiFi network + password by hand (the
#   installer needs the network up before it can fetch this file); everything
#   after that is automatic.
#
#   ⚠️ WIPES THE WHOLE DISK. All existing OS/data on the tablet is erased.
#   ⚠️ Change the default password below before using this in the wild.
# ============================================================

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string salah-board
d-i netcfg/get_domain string
d-i netcfg/hostname string salah-board
# Don't stall the install if WiFi is flaky
d-i netcfg/dhcp_timeout string 60
d-i netcfg/link_wait_timeout string 30

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts — root login disabled, so the first user gets sudo (the kiosk
### installer needs sudo). CHANGE THIS PASSWORD.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Salah Board
d-i passwd/username string board
d-i passwd/user-password password salahboard
d-i passwd/user-password-again password salahboard
d-i user-setup/allow-password-weak boolean true

### Clock & time zone
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Colombo
d-i clock-setup/ntp boolean true

### Partitioning — auto-detect the disk (works for /dev/sda, /dev/mmcblk0,
### etc.) and use the whole thing, one partition, no LVM/encryption.
d-i partman/early_command string \
  DISK="$(list-devices disk | head -n1)"; \
  debconf-set partman-auto/disk "$DISK"; \
  debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system + packages — NO desktop environment
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo git ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true

### Finish without prompting
d-i finish-install/reboot_in_progress note

### (Optional) Turn the fresh install into a kiosk automatically on first
### boot: clone this repo and enable a one-shot service that runs
### install-kiosk.sh once the network is up, then reboots into the board.
### Comment this block out if you'd rather run install-kiosk.sh by hand.
d-i preseed/late_command string \
  in-target git clone https://github.com/msfrox/Salah-board.git /home/board/Salah-board ; \
  in-target chown -R board:board /home/board/Salah-board ; \
  in-target cp /home/board/Salah-board/deploy/linux/salahboard-firstboot.service /etc/systemd/system/salahboard-firstboot.service ; \
  in-target systemctl enable salahboard-firstboot.service
